[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "walldeck"
version = "0.1.0"
description = "Wallpaper profiles for Windows virtual desktops and monitors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.gui-scripts]
walldeck = "walldeck.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
